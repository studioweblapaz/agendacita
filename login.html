<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Studio Web La Paz</title>
  <meta name="theme-color" content="#1b4332">
  
  <!-- PWA: Necesario para que funcione el botón de instalar -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#1b4332;--primary-dark:#081c15;--primary-soft:#e8f0ec;
      --accent:#d4af37;--text:#1c2b26;--muted:#5b6b64;
      --bg:#f6f8f7;--line:#e6ebe8;--radius:18px;--shadow:0 10px 30px rgba(8,28,21,.08);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
    h1,h2{font-family:'Poppins',sans-serif;color:var(--primary-dark)}
    .header{background:#fff;border-bottom:1px solid var(--line);padding:16px 0}
    .header-inner{width:92%;max-width:1120px;margin:0 auto;display:flex;align-items:center}
    .logo{display:flex;align-items:center;gap:10px;font-family:'Poppins';font-weight:700;color:var(--primary-dark);text-decoration:none}
    .logo strong{color:var(--accent)}
    .logo-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;font-weight:800}
    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
    .form-card{background:#fff;width:100%;max-width:440px;border-radius:var(--radius);padding:36px;box-shadow:var(--shadow);border:1px solid var(--line)}
    .form-card h2{font-size:1.5rem;margin-bottom:6px;text-align:center}
    .form-card>p{color:var(--muted);text-align:center;margin-bottom:28px;font-size:.95rem}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;color:var(--primary-dark)}
    .form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fafbfa}
    .form-group input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
    .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed}
    .error-msg{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px;border-radius:10px;font-size:.88rem;margin-bottom:18px;display:none;align-items:center;gap:8px}
    .error-msg.show{display:flex}
    .footer{text-align:center;padding:24px;color:var(--muted);font-size:.85rem}
    .footer a{color:var(--primary);text-decoration:none;font-weight:600}
    .footer a:hover{text-decoration:underline}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:-2px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span class="logo-mark">S.</span> Studio Web <strong>La Paz</strong></a>
    </div>
  </header>

  <main class="main">
    <div class="form-card">
      <h2>Bienvenido de vuelta 👋</h2>
      <p>Ingresa a tu panel para gestionar tus citas.</p>
      <div class="error-msg" id="errorMsg">⚠️ <span id="errorText"></span></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="pass">Contraseña</label>
          <input type="password" id="pass" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Iniciar sesión</button>
      </form>

      <!-- BOTÓN DE INSTALAR APP (Oculto por defecto, aparece si el navegador lo permite) -->
      <button id="btnInstalar" class="btn" style="margin-top:16px;display:none;background:var(--accent);color:var(--primary-dark);font-weight:700">
        📲 Instalar como app en este dispositivo
      </button>
    </div>
  </main>

  <footer class="footer">¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a> · <a href="index.html">← Volver al inicio</a></footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    // ===== FIREBASE CONFIG =====
    const firebaseConfig = {
      apiKey: "AIzaSyDt-_KC2v4Ilrlj1RazjQL_swNP6cpKuUk",
      authDomain: "agenda-de-citas-e885f.firebaseapp.com",
      projectId: "agenda-de-citas-e885f",
      storageBucket: "agenda-de-citas-e885f.firebasestorage.app",
      messagingSenderId: "487795118627",
      appId: "1:487795118627:web:0cc1277e77c88ba6e05796"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ===== LÓGICA DE LOGIN =====
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const errBox = document.getElementById('errorMsg');
    const errText = document.getElementById('errorText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Entrando...';
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        window.location.href = 'admin.html';
      } catch (err) {
        let m = 'Ocurrió un error.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') m = 'Correo o contraseña incorrectos.';
        else if (err.code === 'auth/wrong-password') m = 'La contraseña es incorrecta.';
        else if (err.code === 'auth/invalid-email') m = 'El correo no es válido.';
        else if (err.code === 'auth/network-request-failed') m = 'Sin conexión a internet.';
        errText.textContent = m;
        errBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    });

    // ===== LÓGICA DE INSTALACIÓN PWA =====
    let deferredPrompt;
    const btnInstalar = document.getElementById('btnInstalar');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); // Evita el popup automático del navegador
      deferredPrompt = e; // Guardamos el evento para usarlo cuando el usuario haga clic
      btnInstalar.style.display = 'block'; // Mostramos nuestro botón personalizado
    });

    btnInstalar.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt(); // Muestra el diálogo nativo de instalación del navegador
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        btnInstalar.style.display = 'none'; // Ocultamos el botón tras instalar exitosamente
      }
      deferredPrompt = null;
    });

    // Registrar el Service Worker (necesario para que funcione como PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
