<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Studio Web La Paz</title>
  <meta name="theme-color" content="#1b4332">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#1b4332;--primary-dark:#081c15;--primary-soft:#e8f0ec;
      --accent:#d4af37;--accent-soft:#f6e7b8;--text:#1c2b26;--muted:#5b6b64;
      --bg:#f6f8f7;--line:#e6ebe8;--radius:18px;--shadow:0 10px 30px rgba(8,28,21,.08);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
    h1,h2,h3{font-family:'Poppins',sans-serif;line-height:1.15;color:var(--primary-dark)}
    .header{background:#fff;border-bottom:1px solid var(--line);padding:16px 0}
    .header-inner{width:92%;max-width:1120px;margin:0 auto;display:flex;align-items:center}
    .logo{display:flex;align-items:center;gap:10px;font-family:'Poppins';font-weight:700;color:var(--primary-dark);font-size:1.05rem;text-decoration:none}
    .logo strong{color:var(--accent)}
    .logo-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;font-weight:800}
    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
    .form-card{background:#fff;width:100%;max-width:440px;border-radius:var(--radius);padding:36px;box-shadow:var(--shadow);border:1px solid var(--line)}
    .form-card h2{font-size:1.5rem;margin-bottom:6px;text-align:center}
    .form-card>p{color:var(--muted);text-align:center;margin-bottom:28px;font-size:.95rem}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;color:var(--primary-dark)}
    .form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;transition:.2s;background:#fafbfa}
    .form-group input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
    .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed}
    .error-msg{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px;border-radius:10px;font-size:.88rem;margin-bottom:18px;display:none;align-items:center;gap:8px}
    .error-msg.show{display:flex}
    .success-msg{background:#e3f1e6;color:#1b4332;border:1px solid #b7d9c1;padding:12px;border-radius:10px;font-size:.88rem;margin-bottom:18px;display:none;align-items:center;gap:8px}
    .success-msg.show{display:flex}
    .footer{text-align:center;padding:24px;color:var(--muted);font-size:.85rem}
    .footer a{color:var(--primary);text-decoration:none;font-weight:600}
    .footer a:hover{text-decoration:underline}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:-2px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span class="logo-mark">S.</span> Studio Web <strong>La Paz</strong></a>
    </div>
  </header>

  <main class="main">
    <div class="form-card">
      <h2>Crea tu cuenta gratis</h2>
      <p>Empieza tu prueba de 14 días. Sin tarjeta, sin cobros automáticos.</p>

      <div class="error-msg" id="errorMsg">⚠️ <span id="errorText"></span></div>
      <div class="success-msg" id="successMsg">✅ <span id="successText"></span></div>

      <form id="regForm">
        <div class="form-group">
          <label for="negocio">Nombre de tu negocio</label>
          <input type="text" id="negocio" placeholder="Ej. Lashes by Ana" required>
        </div>
        <div class="form-group">
          <label for="dueno">Tu nombre</label>
          <input type="text" id="dueno" placeholder="Ej. Ana López" required>
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="pass">Contraseña (mínimo 6 caracteres)</label>
          <input type="password" id="pass" placeholder="••••••" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Crear mi cuenta gratis</button>
      </form>
    </div>
  </main>

  <footer class="footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a> · <a href="index.html">← Volver al inicio</a></footer>

  <!-- Firebase SDK (modo compat: funciona con file:// y Live Server) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDt-_KC2v4Ilrlj1RazjQL_swNP6cpKuUk",
      authDomain: "agenda-de-citas-e885f.firebaseapp.com",
      projectId: "agenda-de-citas-e885f",
      storageBucket: "agenda-de-citas-e885f.firebasestorage.app",
      messagingSenderId: "487795118627",
      appId: "1:487795118627:web:0cc1277e77c88ba6e05796"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const form = document.getElementById('regForm');
    const btn = document.getElementById('submitBtn');
    const errBox = document.getElementById('errorMsg');
    const errText = document.getElementById('errorText');
    const okBox = document.getElementById('successMsg');
    const okText = document.getElementById('successText');

    function showError(msg){ errText.textContent = msg; errBox.classList.add('show'); okBox.classList.remove('show'); }
    function showSuccess(msg){ okText.textContent = msg; okBox.classList.add('show'); errBox.classList.remove('show'); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show'); okBox.classList.remove('show');
      const negocio = document.getElementById('negocio').value.trim();
      const dueno = document.getElementById('dueno').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Creando tu cuenta...';

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        // Guardamos el negocio con el UID como id de documento
        await db.collection('negocios').doc(cred.user.uid).set({
          nombre: negocio,
          dueno: dueno,
          email: email,
          slug: negocio.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          plan: 'prueba',
          pruebaHasta: Date.now() + 14*24*60*60*1000
        });
        showSuccess('¡Cuenta creada! Entrando a tu panel...');
        setTimeout(() => { window.location.href = 'admin.html'; }, 1200);
      } catch (err) {
        console.error(err);
        let m = 'Ocurrió un error. Intenta de nuevo.';
        if (err.code === 'auth/email-already-in-use') m = 'Ese correo ya está registrado. Inicia sesión.';
        else if (err.code === 'auth/weak-password') m = 'La contraseña debe tener al menos 6 caracteres.';
        else if (err.code === 'auth/invalid-email') m = 'El correo no es válido.';
        else if (err.code === 'auth/network-request-failed') m = 'Sin conexión a internet. Revisa tu red.';
        showError(m);
        btn.disabled = false;
        btn.textContent = 'Crear mi cuenta gratis';
      }
    });
  </script>
</body>
</html>
